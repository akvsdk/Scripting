<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quota Panel Kit · Local 4-Tier Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #030712;
      background-image:
        radial-gradient(circle at 14% 12%, rgba(29, 111, 251, 0.34), transparent 42%),
        radial-gradient(circle at 86% 86%, rgba(6, 182, 212, 0.28), transparent 44%),
        radial-gradient(circle at 72% 34%, rgba(168, 85, 247, 0.24), transparent 40%),
        linear-gradient(rgba(56, 189, 248, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.055) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 14px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: ui-monospace, monospace;
    }
    button:hover { background: rgba(255,255,255,0.16); }
    button.active { background: rgba(56,189,248,0.22); border-color: rgba(116,225,255,0.6); color: #74e1ff; }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <button class="active" data-tier="ultra">ULTRA</button>
      <button data-tier="pro">PRO</button>
      <button data-tier="enterprise">ENTERPRISE</button>
      <button data-tier="free">FREE</button>
    </div>
    <quota-panel id="demo" variant="crystal"></quota-panel>
  </main>

  <script type="module">
    import './quota-panel.js';
    const panel = document.getElementById('demo');
    const tiers = {
      ultra: { email: 'ka***nb@gmail.com', badge: { text: 'ULTRA', icon: 'ultra', tone: 'purple' }, model: 'Gemini 4 Neon (High)' },
      pro: { email: 'dk***ak@gmail.com', badge: { text: 'PRO', icon: 'pro', tone: 'accent' }, model: 'Gemini 4 Argon (Medium)' },
      enterprise: { email: 'en***se@company.io', badge: { text: 'ENTERPRISE', icon: 'enterprise', tone: 'gold' }, model: 'Enterprise Seat' },
      free: { email: 'de***mo@gmail.com', badge: { text: 'FREE', icon: 'free', tone: 'default' }, model: 'Gemini Flash' },
    };

    function show(k) {
      const t = tiers[k];
      panel.data = {
        id: 'agy',
        updatedAt: Date.now(),
        title: '当前账号',
        accountEmail: t.email,
        subtitle: t.model,
        badges: [t.badge],
        items: [
          { id: 'gemini-5h', icon: 'spark', label: 'Gemini 4 / 3.8', windowTag: '5H', remainingPercent: 83, resetInText: '1h 0m', resetTone: '5h' },
          { id: '3p-5h', icon: 'cluster', label: 'Claude 5.5 / GPT', windowTag: '5H', remainingPercent: 97, resetInText: '1h 48m', resetTone: '5h' },
          { id: 'gemini-weekly', icon: 'spark', label: 'Gemini 周配额', remainingPercent: 89, resetInText: '6d 10h', resetTone: 'weekly' },
          { id: '3p-weekly', icon: 'cluster', label: 'Claude 周配额', remainingPercent: 96, resetInText: '6d 3h', resetTone: 'weekly' },
          { id: 'gemini-argon-neon-5h', icon: 'spark', label: 'Gemini 4 Argon / Neon', windowTag: '5H', remainingPercent: 83, resetInText: '1h 0m', resetTone: '5h', fullWidth: true },
          { id: 'gemini-argon-neon-weekly', icon: 'spark', label: 'Gemini 4 Argon / Neon 周配额', tags: ['High', 'Med', 'Low'], remainingPercent: 89, resetInText: '6d 10h', resetTone: 'weekly', fullWidth: true, featured: true },
        ],
      };
    }

    show('ultra');
    document.querySelectorAll('[data-tier]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tier]').forEach((b) => b.classList.toggle('active', b === btn));
        show(btn.dataset.tier);
      });
    });
  </script>
</body>
</html>
